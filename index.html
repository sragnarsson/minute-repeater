</head><body><style>/* One stage, one watch. The stage is a drawing card; the panel beside it reads like a caption. */
:root{
  --page:#efede7; --card:#fbfaf7; --ink:#1d1e21; --text:#4a4b50; --muted:#8a8a8f; --rule:#dcd9d1;
  --accent:#2f5aa8; --accent-ink:#ffffff; --seen:#2f5aa8; --role:#8a6a2a; --std:#8a8a8f;
  --display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0d0e0f; --card:#141517; --ink:#ecebe6; --text:#b2b1ab; --muted:#7a7a7e; --rule:#2a2b2e;
  --accent:#8fb0f0; --accent-ink:#0d0e0f; --seen:#8fb0f0; --role:#d8b56a; --std:#7a7a7e; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0d0e0f; --card:#141517; --ink:#ecebe6; --text:#b2b1ab; --muted:#7a7a7e; --rule:#2a2b2e;
  --accent:#8fb0f0; --accent-ink:#0d0e0f; --seen:#8fb0f0; --role:#d8b56a; --std:#7a7a7e; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--text);margin:0}
body{font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;height:100dvh;padding:16px;max-width:1500px;margin:0 auto}
.stage-card{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:4px;overflow:hidden;min-height:0}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab;outline:none}
#stage:active{cursor:grabbing}
#stage:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
#gl{width:100%;height:100%;display:block}
.corner{position:absolute;font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);pointer-events:none;z-index:2}
.corner.tl{top:16px;left:18px;color:var(--ink);text-transform:none;letter-spacing:.02em;font-size:12px}
.corner.tr{top:16px;right:18px;text-align:right;max-width:55%}
.corner.bl{bottom:14px;left:18px;max-width:50%}
.corner.br{bottom:14px;right:18px;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
#panel{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--rule);border-radius:4px}
.brand{padding:18px 22px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand b{font:600 13px/1.2 var(--mono);letter-spacing:.06em;color:var(--ink)}
.brand span{font:12px/1.2 var(--mono);color:var(--muted)}
.dots{display:flex;gap:6px;padding:14px 22px 0;flex-wrap:wrap}
.dots button{width:26px;height:26px;border-radius:50%;border:1px solid var(--rule);background:transparent;color:var(--muted);font:500 11px/1 var(--mono);cursor:pointer;padding:0}
.dots button[aria-current="step"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.dots button:focus-visible,.pager button:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{padding:16px 22px 4px}
.head small{font:12px/1 var(--mono);color:var(--muted);letter-spacing:.04em}
.head h2{font:600 30px/1.1 var(--display);color:var(--ink);margin:6px 0 0;text-wrap:balance;letter-spacing:-.005em}
[data-body]{padding:6px 22px 18px;overflow:auto;flex:1;min-height:0}
[data-body] p{margin:.7em 0;max-width:62ch}
[data-body] .lede{font:500 19px/1.45 var(--display);color:var(--ink)}
[data-body] b{color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--muted)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:16px 0;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.specs div{min-width:0}
.specs dt{font:11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.specs dd{margin:2px 0 0;color:var(--ink);font-size:14px}
.act{display:inline-flex;align-items:center;gap:8px;margin:10px 0 4px;padding:10px 16px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--card);font:500 14px/1 var(--body);cursor:pointer}
.act:hover{background:transparent;color:var(--ink)}
.layers{list-style:none;padding:0;margin:12px 0;display:grid;gap:4px;counter-reset:l}
.layers li{counter-increment:l}
.layers button{width:100%;text-align:left;display:flex;gap:12px;align-items:baseline;padding:7px 10px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--text);font:14px/1.3 var(--body);cursor:pointer}
.layers button::before{content:counter(l,decimal-leading-zero);font:11px/1 var(--mono);color:var(--muted)}
.layers button:hover,.layers button[aria-pressed="true"]{border-color:var(--rule);color:var(--ink)}
.scrub{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:16px 0 8px;font:12px/1 var(--mono);color:var(--muted)}
.scrub input{width:100%;accent-color:var(--accent)}
.scrub output{font:500 16px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
.counts{display:flex;gap:18px;font:13px/1.2 var(--body);color:var(--muted)}
.counts b{font:600 28px/1 var(--display);color:var(--ink);display:block}
.timing{margin:16px 0 0}
.timing svg{width:100%;height:auto;display:block}
.timing figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.t-l{font:9px var(--mono);fill:var(--muted)}
.t-base{stroke:var(--rule);stroke-width:1}
.t-low{stroke:var(--ink);stroke-width:2}
.t-high{stroke:var(--accent);stroke-width:2}
.method{padding-left:18px;margin:10px 0}
.method li{margin:.5em 0}
.sources{display:grid;gap:4px;margin-top:14px;font-size:13px}
.sources a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px;overflow-wrap:anywhere}
[data-info]{margin:0 22px 12px;padding:12px 14px;border:1px solid var(--rule);border-radius:4px}
.info-name{font:600 20px/1.2 var(--display);color:var(--ink)}
[data-info] p{margin:.4em 0 0;font-size:14px}
.chip{display:inline-block;margin-top:6px;font:11px/1 var(--mono);letter-spacing:.03em;padding:4px 8px;border-radius:999px;border:1px solid currentColor}
.chip-seen{color:var(--seen)} .chip-role{color:var(--role)} .chip-std{color:var(--std)}
.pager{display:flex;justify-content:space-between;gap:10px;padding:12px 22px 18px;border-top:1px solid var(--rule)}
.pager button{flex:1;padding:11px 14px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--ink);font:500 14px/1 var(--body);cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}
.pager [data-next]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width: 900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:52svh minmax(0,1fr);height:100dvh;padding:8px 8px calc(8px + env(safe-area-inset-bottom, 0px));gap:8px}
  .brand{display:none}
  .dots{padding:10px 16px 0;gap:5px}
  .dots button{width:24px;height:24px;font-size:10px}
  .head{padding:10px 16px 0}
  .head h2{font-size:24px}
  [data-body]{padding:4px 16px 12px}
  [data-body] .lede{font-size:17px}
  [data-info]{margin:0 16px 8px}
  .pager{padding:10px 16px 12px}
  .corner{font-size:10px}
  .corner.tl,.corner.br{font-size:11px}
  .corner.tr{max-width:62%}
  .corner.bl{max-width:58%}
}

// Canvas textures: the dial's printing and the Nº128 engraving.
const Art = (() => {
  const MM = 1024 / 14.9; // px per mm on the dial texture
  function dialTexture() {
    const S = 2048;
    const cv = document.createElement("canvas");
    cv.width = cv.height = S;
    const g = cv.getContext("2d");
    const C = S / 2;
    const at = (x, y) => [C + x * MM, C - y * MM];
    g.fillStyle = "#ffffff";
    g.fillRect(0, 0, S, S);
    // a faint enamel bloom toward the centre
    const grd = g.createRadialGradient(C, C, 0, C, C, C);
    grd.addColorStop(0, "rgba(255,255,255,0)");
    grd.addColorStop(1, "rgba(200,198,190,0.10)");
    g.fillStyle = grd;
    g.fillRect(0, 0, S, S);
    const ink = "#1b1c1f";
    // radial Roman numerals, tops outward; IIII at four, as on the dial in the video
    const numerals = ["XII", "I", "II", "III", "IIII", "V", "VI", "VII", "VIII", "IX", "X", "XI"];
    g.fillStyle = ink;
    g.textAlign = "center";
    g.textBaseline = "middle";
    numerals.forEach((n, i) => {
      const a = (i * 30 * Math.PI) / 180;
      const r = 12.25;
      const [x, y] = at(r * Math.sin(a), r * Math.cos(a));
      g.save();
      g.translate(x, y);
      g.rotate(a);
      g.font = `500 ${1.25 * MM}px "Cinzel", "Trajan Pro", Georgia, serif`;
      g.scale(n.length > 3 ? 0.86 : 1, 1);
      g.fillText(n, 0, 0);
      g.restore();
    });
    // minute dots at the rim
    for (let i = 0; i < 60; i++) {
      if (i % 5 === 0) continue;
      const a = (i * 6 * Math.PI) / 180;
      const [x, y] = at(13.65 * Math.sin(a), 13.65 * Math.cos(a));
      g.beginPath();
      g.arc(x, y, 0.07 * MM, 0, Math.PI * 2);
      g.fill();
    }
    // the complication's name, in an italic under twelve
    g.font = `italic 500 ${1.0 * MM}px "Cormorant Garamond", Georgia, serif`;
    g.fillStyle = "#3b3d42";
    g.fillText("Répétition minutes", ...at(0, 6.2));
    // small seconds at six
    const sc = [0, -5.4];
    g.strokeStyle = "#5a5c61";
    g.lineWidth = 0.05 * MM;
    g.font = `500 ${0.62 * MM}px "Cormorant Garamond", Georgia, serif`;
    g.fillStyle = "#3b3d42";
    [["60", 0], ["15", 90], ["30", 180], ["45", 270]].forEach(([t, d]) => {
      const a = (d * Math.PI) / 180;
      const [x, y] = at(sc[0] + 2.45 * Math.sin(a), sc[1] + 2.45 * Math.cos(a));
      g.fillText(t, x, y);
    });
    for (let i = 0; i < 12; i++) {
      if (i % 3 === 0) continue;
      const a = (i * 30 * Math.PI) / 180;
      const [x0, y0] = at(sc[0] + 2.2 * Math.sin(a), sc[1] + 2.2 * Math.cos(a));
      const [x1, y1] = at(sc[0] + 2.7 * Math.sin(a), sc[1] + 2.7 * Math.cos(a));
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();

    g.fillStyle = "#4b4d52";
    g.save();
    g.translate(...at(0, -12.6));

        pv = new THREE.Group();
        pv.position.set(pivot[0], pivot[1], 0);
        holder.add(pv);
        holder = pv;
        if (mover) (movers[mover] = movers[mover] || []).push(pv);
      }
      const mesh = new THREE.Mesh(geo, null);
      R.add(mesh, mat, { pattern, map });
      holder.add(mesh);
      const p = { name, group, mesh, layer, prov, role, pivot: pv, info };

      parts.push(p);
      (byName[group] = byName[group] || []).push(p);

    }
    const screw = (c, z, r, face, opts) => {
      // a screw head with its slot, facing +z (face = 1) or -z (face = -1)
      const h = 0.22;

    const jewel = (c, z, face, r = 0.62, opts = {}) => {

    // ---------------- CASE ----------------
    add("Case middle", lathe([[R_CASE_IN, -2.75], [16.45, -2.75], [16.9, -2.2], [17.05, -0.9], [17.05, 0.9], [16.9, 2.0], [16.6, 2.3], [R_CASE_IN, 2.3], [R_CASE_IN, -2.75]], [0, 0], 120), "case", { layer: "case", role: "The case band, in white metal. Slim wire lugs and a recessed slide on its left flank.", group: "Case" });

    // crown at 3 o'clock with its tube

    // fluting on the crown: thin ribs

    // the slide: a slot recessed in the left flank, between 8 and 10 o'clock, and its knob

      const knob = (a) => stadiumPath([pol(17.2, a - 3.4), pol(17.2, a + 3.4)], 0.42);
      const k = add("Slide", extrude(knob(0), -0.55, 0.55), "steelBright", { layer: "case", group: "Slide", pivot: [0, 0], mover: "slide", role: "The slide. Pushing it winds the strike mainspring and sets the racks onto the snails; letting go starts the chime." });
      k.mesh.position.set(0, 0, 0);
      const ribs = [];
      for (let i = -2; i <= 2; i++) ribs.push(extrude(stadiumPath([pol(17.6, i * 1.1 - 0.2), pol(17.6, i * 1.1 + 0.2)], 0.05), -0.5, 0.5));
      for (const g of ribs) add("Slide", g, "blackPolish", { layer: "case", group: "Slide", pivot: [0, 0], mover: "slide" });
    }
    // bezel: double-stepped, as on the Villeret case
    add("Bezel", lathe([[14.4, 2.3], [16.6, 2.3], [16.95, 2.5], [16.9, 3.05], [16.25, 3.15], [16.2, 3.55], [15.3, 3.65], [14.95, 3.9], [14.4, 3.9], [14.4, 2.3]], [0, 0], 120), "case", { layer: "bezel", group: "Bezel", role: "The bezel, stepped twice, holds the crystal." });
    // crystal: transparent; only a faint glare band is painted
    {
      const glass = new THREE.Mesh(disc([0, 0], 14.6, 3.0, 3.75, 64), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.0, depthWrite: false }));
      layers.crystal.add(glass);
      const band = new THREE.Mesh(extrude([pol(14.2, 304), pol(14.2, 313), pol(14.2, 135), pol(14.2, 126)], 3.76, 3.77), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.16, depthWrite: false }));

    add("Caseback", lathe([[14.9, -2.75], [16.55, -2.75], [16.55, -3.3], [16.05, -3.5], [15.85, -4.15], [15.2, -4.5], [14.9, -4.5], [14.9, -2.75]], [0, 0], 120), "case", { layer: "back", group: "Caseback", role: "Screwed caseback with a sapphire display window: this is the side your second video shows." });

    // ---------------- DIAL AND HANDS ----------------
    {

    const leaf = (len, w, base = 0.95) => {
      const pts = [];
      const n = 30;
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const x = base + (len - base) * t;
        const hw = w * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.06)), 0.75) * (1 - 0.15 * t);
        pts.push([hw, x]);
      }
      const right = pts.map(([hw, y]) => [hw, y]);
      const left = pts.map(([hw, y]) => [-hw, y]).reverse();
      return [...right, ...left];
    };
    {
      const [hz0, hz1] = Z.hands.hour, [mz0, mz1] = Z.hands.minute;
      const hour = extrude(leaf(8.4, 0.36), hz0, hz1);
      add("Hour hand", hour, "hand", { layer: "hands", group: "Hands", pivot: [0, 0], mover: "hour", role: "Leaf-shaped hour hand." });

      add("Seconds hand", sec, "hand", { layer: "hands", group: "Hands", pivot: sc, mover: "seconds", role: "Small seconds, driven by the fourth wheel." });
      add("Seconds hand", disc(sc, 0.32, Z.hands.sec[0], Z.hands.sec[1] + 0.06, 20), "hand", { layer: "hands", group: "Hands", pivot: sc, mover: "seconds" });
    }

    // ---------------- MAIN PLATE ----------------
    add("Main plate", disc([0, 0], R_PLATE, Z.plateBack, Z.plateFront, 160), "gilt", { layer: "plate", group: "Main plate", pattern: 4, role: "The main plate: every wheel and lever is pivoted in it. Grained in perlage on the dial side, striped on the back." });

    add("Casing ring", ringDisc([0, 0], R_PLATE + 0.05, R_CASE_IN - 0.05, -1.4, 0.0, 140), "giltDeep", { layer: "plate", group: "Main plate", prov: "role", role: "Casing ring between movement and case." });

    // ---------------- DIAL SIDE: STRIKING WORK (standard construction) ----------------
    const UZ = { minuteSnail: [0.25, 0.45], quarterSnail: [0.5, 0.72], star: [0.25, 0.4], hourSnail: [0.45, 0.66], minuteRack: [0.82, 0.97], quarterRack: [1.02, 1.17], hourRack: [1.22, 1.4] };
    const rack = (name, key, label, role) => {
      const r = L.racks[key];
      const z = UZ[key + "Rack"];
      const p = add(label, extrude(r.ring, z[0], z[1]), "steel", { layer: "under", group: label, prov: "std", pivot: r.pivot, mover: "rack-" + key, role });

      const snailZ = key === "hour" ? UZ.hourSnail : key === "quarter" ? UZ.quarterSnail : UZ.minuteSnail;

      // its screw
      const sc = disc(r.pivot, 0.4, z[1], z[1] + 0.12, 20);
      add(label, sc, "steelBright", { layer: "under", group: label, prov: "std", pivot: r.pivot, mover: "rack-" + key });
      return p;
    };
    rack("hour", "hour", "Hour rack", "The hour rack. The slide swings it until its feeler lands on the hour snail. Each tooth it gathers is one hour struck on the low gong.");
    rack("quarter", "quarter", "Quarter rack", "The quarter rack has teeth for both hammers, so each quarter sounds as a high-low pair.");
    rack("minute", "minute", "Minute rack", "The minute rack falls onto the minute snail: up to fourteen minutes past the quarter, struck on the high gong.");
    // rack studs
    for (const key of ["hour", "quarter", "minute"]) {
      const r = L.racks[key];
      add("Rack stud", disc(r.pivot, 0.36, Z.plateFront, UZ[key + "Rack"][0], 16), "steel", { layer: "under", group: "Studs", prov: "std" });
    }
    // snails on the cannon pinion and the star wheel
    add("Minute snail", extrude(L.snails.minute, ...UZ.minuteSnail), "steel", { layer: "under", group: "Minute snail", prov: "std", pivot: [0, 0], mover: "snail-minute", role: "The minute snail turns with the minute hand: four arms of fifteen steps, one step per minute past each quarter." });
    add("Quarter snail", extrude(L.snails.quarter, ...UZ.quarterSnail), "steel", { layer: "under", group: "Quarter snail", prov: "std", pivot: [0, 0], mover: "snail-minute", role: "The quarter snail, four steps: 0, 1, 2 or 3 quarters." });
    add("Cannon pinion", disc([0, 0], 0.62, Z.plateFront, Z.hands.minute[0], 24), "steelBright", { layer: "under", group: "Cannon pinion", prov: "std", pivot: [0, 0], mover: "snail-minute", role: "The cannon pinion carries the minute hand and both snails." });

    }
    // strike mainspring barrel under the hour rack, and the strike train to the governor
    const hp = L.racks.hour.pivot;
    add("Strike barrel", extrude(gear(hp, 2.55, 54, 0.1), 0.22, 0.75, [circle(hp, 0.5, 20).reverse()]), "giltBright", { layer: "under", group: "Strike train", prov: "std", pivot: hp, mover: "strike-barrel", role: "The strike mainspring lives here. The slide winds it; it then drives the racks home and the hammers with them." });
    const st1 = [-9.0, -2.4], st2 = [-8.7, 2.1], gov = G.back([6.9, -5.4]);
    add("Strike train", extrude(gear(st1, 1.9, 42, 0.1), 0.24, 0.4, spokeHoles(st1, 0.45, 1.6, 4, 0.12)), "giltBright", { layer: "under", group: "Strike train", prov: "std", pivot: st1, mover: "strike-1", role: "Strike train: steps the spring's speed up to the governor." });

    // fly governor on the back, under the Nº128 bridge (its arbor ends in that bridge's big jewel)
    {

      const blade = (s) => extrude([[g[0] - 0.55, g[1] + s * 0.35], [g[0] + 0.55, g[1] + s * 0.35], [g[0] + 0.55, g[1] + s * 2.6], [g[0] - 0.55, g[1] + s * 2.6]], -1.95, -1.85);

      add("Lifting pallet", disc(pl, 0.2, 0.75, 1.6, 12), "steelBright", { layer: "under", group: "Hammer " + (k === "low" ? "B" : "A"), prov: "std", pivot: a, mover: "hammer-" + k });

    add("Winding pinion", latheAlong([[0, 0.85], [0.9, 0.85]], [12.6, 0, -0.3], [-1, 0, 0], 14), "steelBright", { layer: "plate", group: "Keyless work", prov: "std" });
    add("Sliding clutch", latheAlong([[0, 0.75], [1.2, 0.75]], [11.2, 0, -0.3], [-1, 0, 0], 12), "steelBright", { layer: "plate", group: "Keyless work", prov: "std" });

    }

    // ---------------- BACK: GOING TRAIN (standard construction, under the bridges) ----------------
    const WB = Z.wheelsBack;
    const wheel = (name, c, r, n, z0, z1, mover, role, k = 4) =>

    phase: "rest", // rest, pull, hold, strike
    pt: 0,
    plan: null,
    rack: { hour: L.racks.hour.home, quarter: L.racks.quarter.home, minute: L.racks.minute.home },
    from: null,
    lift: { low: 0, high: 0 },
    gov: 0, strikeBarrel: 0, st1: 0, st2: 0,
    fired: 0,
    hits: [],
    balance: 0, clock: 0,
    onDone: null,
    snapCount: false,
  };
  const counts = () => RP.countsAt(Math.floor(mech.time));
  // hammer lift direction: positive turns the head inward, off its gong
  // which way each hammer turns to lift off its gong (a clockwise turn is positive)
  const hammerSign = {};
  for (const k of ["low", "high"]) {
    const { a, head } = W.hammers[k];
    const rot = (p, d) => { const r = Math.hypot(p[0] - a[0], p[1] - a[1]); const ang = Math.atan2(p[0] - a[0], p[1] - a[1]) + d * RAD; return [a[0] + r * Math.sin(ang), a[1] + r * Math.cos(ang)]; };
    hammerSign[k] = Math.hypot(...rot(head, 5)) < Math.hypot(...head) ? 1 : -1;
  }

  // ---------- sound: two gongs at the pitches measured from the owner's watch ----------
  let audio = null;
  let soundOn = true;
  function gong(which) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const now = audio.currentTime;
      const partials = which === "low" ? [[3640, 1], [8800, 0.45], [1820, 0.12]] : [[10300, 0.6], [5360, 0.35], [7700, 0.15]];
      const out = audio.createGain();
      out.gain.value = 0.9;
      out.connect(audio.destination);
      for (const [f, a] of partials) {
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = "sine";
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.06 * a, now + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, now + (which === "low" ? 1.7 : 1.1));
        o.connect(g).connect(out);
        o.start(now);
        o.stop(now + 1.8);
      }
    } catch (e) { /* no audio */ }
  }

  // ---------- strike ----------
  function pull(then) {
    mech.phase = "pull"; mech.pt = 0; mech.plan = RP.planOf(Math.floor(mech.time)); mech.from = { ...mech.rack };
    mech.fired = 0; mech.onDone = then || null;
    kick();
  }
  function strike(then) {
    if (mech.phase === "rest") { pull(() => strike(then)); return; }
    mech.phase = "strike"; mech.pt = 0; mech.plan = RP.planOf(Math.floor(mech.time)); mech.fired = 0; mech.onDone = then || null;
    kick();
  }
  function rest() { mech.phase = "rest"; mech.lift = { low: 0, high: 0 }; kick(); }

  function stepMech(dt) {
    const c = mech.plan ? mech.plan.counts : counts();
    let moving = false;
    if (mech.phase === "pull") {
      mech.pt += dt;
      const p = still.matches ? 1 : ease(mech.pt / 0.9);
      const fall = still.matches ? 1 : ease((mech.pt - 0.25) / 0.45);
      mech.rack.hour = mech.from.hour + (rackAngle("hour", c.hours) - mech.from.hour) * p;
      mech.rack.quarter = mech.from.quarter + (rackAngle("quarter", c.quarters) - mech.from.quarter) * fall;
      mech.rack.minute = mech.from.minute + (rackAngle("minute", c.minutes) - mech.from.minute) * fall;
      mech.strikeBarrel = -(mech.rack.hour - L.racks.hour.home) * 2.2;
      moving = true;
      if (mech.pt > (still.matches ? 0.05 : 1.2)) {
        mech.phase = "hold";
        const cb = mech.onDone; mech.onDone = null;
        if (cb) cb();
      }
    } else if (mech.phase === "hold") {
      // racks rest on the snails at the current time (the counting chapter moves the time)
      const target = { hour: rackAngle("hour", c.hours), quarter: rackAngle("quarter", c.quarters), minute: rackAngle("minute", c.minutes) };
      for (const k of RACK_KEYS) {
        const d = target[k] - mech.rack[k];
        mech.rack[k] += still.matches ? d : d * (1 - Math.exp(-dt / 0.12));
        if (Math.abs(d) > 0.01) moving = true; else mech.rack[k] = target[k];
      }
    } else if (mech.phase === "strike") {
      mech.pt += dt;
      const out = RP.racksAt(mech.plan, mech.pt);
      for (const k of RACK_KEYS) {
        const ph = mech.plan.phases.find((p) => p.rack === k);
        const done = mech.pt - ph.to;
        const home = L.racks[k].home, zero = rackAngle(k, L.racks[k].first);
        mech.rack[k] = done <= 0 ? rackAngle(k, out[k] + (k === "hour" ? 0 : 0)) : zero + (home - zero) * ease(done / 0.3);
        if (k === "hour" && done <= 0) mech.rack[k] = rackAngle("hour", Math.max(L.racks.hour.first - 1, out.hour));
      }
      const running = mech.pt < mech.plan.length - 0.6;
      if (running) { mech.gov += dt * 2400; mech.strikeBarrel += dt * 25; mech.st1 -= dt * 90; mech.st2 += dt * 300; }
      for (const n of ["low", "high"]) {
        let lift = 0, best = -1;
        for (const b of mech.plan.blows) {
          if (b.hammer !== n) continue;
          const beat = b.group === "hour" ? RP.REPEAT.hourBeat : b.group === "minute" ? RP.REPEAT.minuteBeat : RP.REPEAT.quarterLag * 1.6;
          const rise = beat * 0.55;
          const t = mech.pt - (b.at - rise);
          if (t <= 0 || t > rise + 0.14) continue;
          let v;
          if (t < rise) v = 11 * (t / rise);
          else if (t < rise + 0.025) v = 11 - 11.6 * ((t - rise) / 0.025);
          else v = -0.6 * (1 - ease((t - rise - 0.025) / 0.11));
          if (t > best) { best = t; lift = v; }
        }
        mech.lift[n] = still.matches ? 0 : lift;
      }
      while (mech.fired < mech.plan.blows.length && mech.plan.blows[mech.fired].at <= mech.pt) {
        const b = mech.plan.blows[mech.fired++];
        mech.hits.push({ g: b.hammer, at: mech.clock, b });
        gong(b.hammer);
      }
      moving = true;
      if (mech.pt >= mech.plan.length) {
        mech.phase = "rest";
        mech.lift = { low: 0, high: 0 };
        const cb = mech.onDone; mech.onDone = null;
        if (cb) cb();
      }
    } else {
      for (const k of RACK_KEYS) {
        const d = L.racks[k].home - mech.rack[k];
        mech.rack[k] += still.matches ? d : d * (1 - Math.exp(-dt / 0.15));
        if (Math.abs(d) > 0.01) moving = true; else mech.rack[k] = L.racks[k].home;
      }
    }
    mech.hits = mech.hits.filter((h) => mech.clock - h.at < 1.8);
    if (mech.hits.length) moving = true;
    return moving;
  }

  // ---------- apply state to the scene ----------
  const setRot = (key, deg) => { for (const g of W.movers[key] || []) g.rotation.z = -deg * RAD; };
  function apply() {
    const T = mech.time + mech.sec / 60;
    setRot("hour", (T / 720) * 360);
    setRot("minute", (T % 60) * 6);
    setRot("seconds", mech.sec * 6);
    const m = Math.floor(mech.time) % 60;
    setRot("snail-minute", m * 6 + 3 + (mech.sec / 60) * 6 * 0);
    setRot("star", 30 * (Math.floor((Math.floor(mech.time) % 720) / 60)));
    setRot("motion", -(T % 60) * 6 * 3);
    for (const k of RACK_KEYS) setRot("rack-" + k, mech.rack[k]);
    // the slide follows the hour rack's swing: up at rest, down toward 8 o'clock when pushed
    const h = L.racks.hour;
    const swing = (mech.rack.hour - h.home) / (rackAngle("hour", 12) - h.home);
    const slideDeg = 287 - 34 * clamp(swing, 0, 1.05);
    setRot("slide", slideDeg);
    for (const g of W.movers["slide-pusher"] || []) g.position.y = -2.6 * clamp(swing, 0, 1.05);
    for (const k of ["low", "high"]) setRot("hammer-" + k, mech.lift[k] * hammerSign[k]);
    setRot("strike-barrel", mech.strikeBarrel);
    setRot("strike-1", mech.st1);
    setRot("strike-2", mech.st2);
    setRot("governor", mech.gov);
    // going train
    const fourth = mech.sec * 6 + (T % 1) * 360;
    setRot("fourth", fourth);
    setRot("third", -fourth / 7.5);
    setRot("center", (T % 60) * 6);
    setRot("escape", -fourth * 9);
    setRot("barrel", -(T / 60) * 360 / 8.8);
    setRot("balance", mech.balance);
    setRot("pallet", Math.sin(mech.clock * 2 * Math.PI * 3 * mech.slowK) * 6);
    // gongs shiver after each blow
    for (const p of [...(W.byName["High gong"] || []), ...(W.byName["Low gong"] || [])]) {
      let amp = 0;
      for (const hh of mech.hits) {
        const isLow = p.name === "Low gong";
        if ((hh.g === "low") !== isLow) continue;
        const dt = mech.clock - hh.at;
        amp += Math.exp(-dt / 0.3) * Math.sin(dt * 2 * Math.PI * 9);
      }
      p.mesh.scale.setScalar(1 + (still.matches ? 0 : amp * 0.009));
    }
  }
  mech.slowK = 1;

  // ---------- layout of the stage ----------
  function size() {
    const r = stage.getBoundingClientRect();
    const dpr = Math.min(2, Math.max(1.5, window.devicePixelRatio || 1));
    R.resize(Math.max(1, r.width), Math.max(1, r.height), dpr);
  }

  function orient() {
    const q = new THREE.Quaternion();
    const qx = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), (view.pitch + view.user.pitch) * RAD);
    const qy = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), (view.yaw + view.user.yaw + view.spin) * RAD);
    const qz = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), view.roll * RAD);
    q.multiply(qx).multiply(qy).multiply(qz);
    W.root.quaternion.copy(q);
    for (const [name] of W.LAYERS) W.layers[name].position.z = layerOff[name];
    W.root.updateMatrixWorld(true);
    // keep the focus point centred
    const f = new THREE.Vector3(view.fx, view.fy, view.fz);
    W.root.localToWorld(f);
    const r = stage.getBoundingClientRect();
    const portrait = r.height > r.width;
    const half = (view.zoom / view.user.zoom) * (portrait ? r.height / r.width : 1);
    R.frame({ halfH: half, cx: f.x, cy: f.y });
  }

  // ---------- looks: dim, lit, hatch ----------
  const current = new Map();
  function setLooks(fn) {
    for (const p of W.parts) looks.set(p, fn(p));
  }
  function stepLooks(dt) {
    let moving = false;
    const k = still.matches ? 1 : 1 - Math.exp(-dt / 0.18);
    for (const p of W.parts) {
      const t = looks.get(p) || { dim: 1, lit: 0, hatch: 0 };
      const c = current.get(p) || { dim: 1, lit: 0, hatch: 0 };
      const sel = selected && selected === p.group;
      const want = !selected ? t : sel ? { dim: 1, lit: 0.45, hatch: t.hatch } : { dim: Math.min(t.dim, 0.35), lit: 0, hatch: t.hatch };
      for (const key of ["dim", "lit", "hatch"]) {
        const d = want[key] - c[key];
        if (Math.abs(d) > 0.002) { c[key] += d * k; moving = true; } else c[key] = want[key];
      }
      current.set(p, c);
      R.setLook(p.mesh, c);
    }
    return moving;
  }

  // ---------- chapters ----------
  const all = () => ({ dim: 1, lit: 0, hatch: 0 });
  const only = (groups, dimOthers = 0.22) => (p) => (groups.includes(p.group) || groups.includes(p.layer) ? { dim: 1, lit: 0, hatch: 0 } : { dim: dimOthers, lit: 0, hatch: 0 });
  // layers lifted off toward the viewer and then hidden, so a face-on view isn't blocked
  const DIAL_OFF = { crystal: "off", bezel: "off", hands: "off", dial: "off" };
  const BACK_OFF = { back: "off", top: "off", hammers: "off", bridges: "off" };
  const fmt = (t) => { const c = RP.countsAt(Math.floor(t)); return `${c.h12}:${String(c.m).padStart(2, "0")}`; };

  const CHAPTERS = [
    {
      id: "watch", fig: "Nº128", title: "Villeret Répétition Minutes",
      hint: "Drag to turn · pinch to zoom",
      view: { yaw: -26, pitch: -36, roll: 0, zoom: 25, f: [0, 0, 0] },
      layers: {}, look: all, auto: true, mech: "rest",
      readout: () => `${fmt(mech.time)} · at rest`,
      body: `
        <p class="lede">A minute repeater tells the time out loud. Push the slide on its flank and it rings the hours, the quarters and the minutes on two steel gongs coiled inside the case.</p>
        <p>This is your watch: the Blancpain Villeret Répétition Minutes, reference 0033, with calibre 33 inside. The movement on the back is engraved Nº128.</p>
        <dl class="specs">
          <div><dt>Case</dt><dd>34 mm, about 8.6 mm thick</dd></div>
          <div><dt>Movement</dt><dd>Calibre 33, hand-wound</dd></div>
          <div><dt>Jewels</dt><dd>31</dd></div>
          <div><dt>Power reserve</dt><dd>44 hours</dd></div>
          <div><dt>Gongs</dt><dd>Two, low and high</dd></div>
          <div><dt>Introduced</dt><dd>About 1988</dd></div>
        </dl>
        <button class="act" data-act="strike">Push the slide · ring 12:03</button>
        <p class="note">Case and movement numbers are from auction records of the same reference. The chime's timing and tones come from the sound in your video.</p>`,
    },
    {
      id: "outside", fig: "Fig 1", title: "The case and the slide",
      hint: "Tap a part to name it",
      view: { yaw: 64, pitch: -20, roll: 0, zoom: 19, f: [-7, 0, 0] },
      layers: {}, look: () => all(), mech: "rest",
      readout: () => "slide at rest",
      body: `
        <p class="lede">From the front it is a plain, thin dress watch. The only clue is a slide recessed into the left flank.</p>
        <p>The case is round with a bezel stepped twice and slim wire lugs. The white dial carries radial Roman numerals, a four written IIII, and small seconds at six.</p>

      body: `

      layers: Object.fromEntries(W.LAYERS.map(([n, off]) => [n, off])), look: () => all(), mech: "rest", stagger: true,
      readout: () => `${W.LAYERS.length} layers`,
      body: () => `
        <p class="lede">The watch comes apart into layers, front to back. The movement sits in the middle; the dial side carries the striking work, the back carries the going train, hammers and gongs.</p>

    {

      layers: { ...BACK_OFF }, look: only(["Balance", "Escapement", "Going train", "Going barrel", "Governor"], 0.25), mech: "run",
      readout: () => `${fmt(mech.time)}:${String(Math.floor(mech.sec)).padStart(2, "0")}${mech.slow > 1 ? " · ×1/" + mech.slow : ""}`,
      body: `
        <p class="lede">Keeping time and telling it are separate jobs. This side keeps it.</p>
        <p>The mainspring in the barrel pushes the wheels round. Left alone they would spin out in seconds; the escapement lets them advance one tooth at a time, each time the balance swings past centre.</p>
        <p>The balance and its hairspring swing at a steady rate, like a pendulum you can wear. That rate is the watch's sense of time. The fourth wheel turns once a minute and carries the small seconds hand.</p>
        <button class="act" data-act="slow">Slow the balance down</button>

    },
    {

      layers: { ...DIAL_OFF }, look: only(["Hour rack", "Quarter rack", "Minute rack", "Slide", "Minute snail", "Quarter snail", "Hour snail and star", "Strike train", "Cannon pinion", "All-or-nothing piece"], 0.3), mech: "rest",
      readout: () => (mech.phase === "hold" ? `racks set · ${counts().hours} + ${counts().quarters} + ${counts().minutes}` : mech.phase === "pull" ? "pushing the slide" : "slide up"),
      body: `
        <p class="lede">Under the dial is the striking work. Pushing the slide does two things at once.</p>

    {

      layers: { ...DIAL_OFF }, look: (p) => (p.name === "Feeler pin" ? { dim: 1, lit: 1, hatch: 0 } : only(["Hour rack", "Quarter rack", "Minute rack", "Minute snail", "Quarter snail", "Hour snail and star", "Cannon pinion"], 0.25)(p)), mech: "hold",
      readout: () => `${fmt(mech.time)} · ${counts().hours} + ${counts().quarters} + ${counts().minutes}`,
      body: () => `
        <p class="lede">The watch never counts while it rings. It reads three stepped cams, called snails, that turn with the hands.</p>
        <p>The <b>hour snail</b> has twelve steps and jumps one step each hour. The <b>quarter snail</b> has four. The <b>minute snail</b> has four arms of fifteen steps, one per minute past each quarter.</p>
        <p>Each rack's feeler drops onto the step under it. A deeper step lets the rack swing further and gather one more tooth, and each tooth gathered is one blow on the way back. Think of a dipstick: how far it goes in is the reading.</p>
        <label class="scrub"><span>Time</span><input type="range" id="t-scrub" min="0" max="719" step="1" value="${Math.floor(mech.time) % 720}"><output id="t-out">${fmt(mech.time)}</output></label>
        <div class="counts" id="counts"></div>`,

    {

      readout: () => {

        return "striking";
      },
      body: `
        <p class="lede">Let go of the slide and the strike mainspring takes over.</p>
        <p>It drives the hour rack home one tooth at a time. Each tooth catches a pallet on the hammer's arbor, cocks the hammer, then slips past; the hammer flies back onto its gong. The fly governor spins against the air to keep the beat even.</p>
        <p>Hours ring on the low gong. Then the quarter rack runs: each quarter is a pair, high then low, ding-dong. Then the minute rack: one high note per minute.</p>
        <button class="act" data-act="ring">Ring ${fmt(723)} with sound</button>
        <figure class="timing"><svg id="timing" viewBox="0 0 320 64" role="img" aria-label="Strike timing at 12:03: your recording against the model"></svg>
        <figcaption>12:03 in your recording (top) and in the model (bottom): twelve low notes 0.53 s apart, a pause where the quarters would be, three high notes 0.44 s apart.</figcaption></figure>`,

      readout: () => { const g = (f) => new Set(W.parts.filter(f).map((p) => p.group)).size; return `${g((p) => p.prov !== "std")} parts traced · ${g((p) => p.prov === "std")} inferred`; },
      body: `
        <p class="lede">Built by Claude from two phone videos and a few public records.</p>
        <ul class="method">
          <li><b>Listening.</b> The audio of your first video was split into strikes: twelve low ones 0.53 s apart, strongest near 3.6 kHz; a 3.3 s gap; then three high ones 0.44 s apart, strongest near 10.3 kHz. That is 12:03, and the hands agree.</li>
          <li><b>Tracing.</b> A frame of your second video was laid under a millimetre grid scaled to the 34 mm case, and every bridge, jewel, screw, wheel and hammer on the back was read off it.</li>
          <li><b>Reading.</b> Reference, calibre, jewels and power reserve come from auction records of the same watch.</li>
          <li><b>Inferring.</b> The dial side and the wheel train under the bridges aren't visible anywhere. They are drawn hatched here: standard minute-repeater construction, placed to meet the parts that are seen.</li>
        </ul>
        <p class="note">To make the hidden half exact, the watch needs a photo with the dial off, usually at its next service.</p>
        <div class="sources"><b>Sources</b>
          <a href="https://www.hampel-auctions.com/a/archive-catalogue-detail.html?la=it&a=126&s=749&id=564634" target="_blank" rel="noopener">Hampel: Blancpain calibre 33, 31 jewels, 44 h</a>
          <a href="https://www.europeanwatch.com/watch/blancpain-0033-1418-55-repetition-minutes-platinum-34mm-possibly-29143" target="_blank" rel="noopener">European Watch: ref. 0033, 34 mm, 8.5–8.7 mm</a>
          <a href="https://www.watchprosite.com/blancpain/an-understated-minute-repeater/4.1707226.17803086/0/" target="_blank" rel="noopener">WatchProSite: ref. 0033, calibre 33, about 1988</a>
          <a href="https://hairspring.com/blogs/finds/0033-blancpain-manual-minute-repeater" target="_blank" rel="noopener">Hairspring: 0033 manual minute repeater</a>
        </div>`,
    },
  ];

  let chapter = 0;
  function go(i, { instant = false } = {}) {
    chapter = clamp(i, 0, CHAPTERS.length - 1);
    const C = CHAPTERS[chapter];
    selected = null;
    view.t.yaw = C.view.yaw; view.t.pitch = C.view.pitch; view.t.roll = C.view.roll; view.t.zoom = C.view.zoom;
    [view.t.fx, view.t.fy, view.t.fz] = C.view.f;
    view.user.yaw = 0; view.user.pitch = 0; view.user.zoom = 1;
    view.auto = !!C.auto && !still.matches;
    if (!view.auto) view.spin = ((view.spin % 360) + 540) % 360 - 180;
    for (const [name, off] of W.LAYERS) {
      const v = C.layers[name] ?? 0;
      layerHide[name] = v === "off";
      layerTarget[name] = v === "off" ? (off >= 0 ? 60 : -60) : v;
      if (!layerHide[name]) W.layers[name].visible = true;
    }
    setLooks(C.look);
    mech.running = C.mech === "run";
    if (C.mech === "hold") { if (mech.phase === "rest") pull(); }
    else if (mech.phase === "hold" || mech.phase === "pull") rest();
    if (instant) {
      Object.assign(view, { yaw: view.t.yaw, pitch: view.t.pitch, roll: view.t.roll, zoom: view.t.zoom, fx: view.t.fx, fy: view.t.fy, fz: view.t.fz });
      for (const [name] of W.LAYERS) layerOff[name] = layerTarget[name];
    }
    figEl.textContent = C.fig; titleEl.textContent = C.title; hintEl.textContent = C.hint;
    panel.querySelector("[data-chapter-title]").textContent = C.title;
    panel.querySelector("[data-chapter-num]").textContent = `${chapter + 1} / ${CHAPTERS.length}`;
    const body = panel.querySelector("[data-body]");
    body.innerHTML = typeof C.body === "function" ? C.body() : C.body;
    body.scrollTop = 0;
    panel.querySelector("[data-info]").hidden = true;
    document.querySelectorAll("[data-go]").forEach((b, k) => b.setAttribute("aria-current", k === chapter ? "step" : "false"));
    $("[data-prev]").disabled = chapter === 0;
    $("[data-next]").disabled = chapter === CHAPTERS.length - 1;
    wireBody();
    try { history.replaceState(null, "", "#" + C.id); } catch (e) {}
    stagger = C.stagger ? performance.now() : 0;
    kick();
  }
  let stagger = 0;

  function wireBody() {
    const body = panel.querySelector("[data-body]");
    body.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => act(b.dataset.act)));
    body.querySelectorAll("[data-layer]").forEach((b) => b.addEventListener("click", () => {
      const n = b.dataset.layer;
      setLooks(only([n], 0.18));
      body.querySelectorAll("[data-layer]").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      kick();
    }));
    const scrub = body.querySelector("#t-scrub");
    if (scrub) {
      const outEl = body.querySelector("#t-out");
      const show = () => {
        mech.time = 720 + +scrub.value;
        outEl.textContent = fmt(mech.time);
        const c = counts();
        body.querySelector("#counts").innerHTML = `<span><b>${c.hours}</b> hour${c.hours > 1 ? "s" : ""}</span><span><b>${c.quarters}</b> quarter${c.quarters === 1 ? "" : "s"}</span><span><b>${c.minutes}</b> minute${c.minutes === 1 ? "" : "s"}</span>`;
        kick();
      };
      scrub.addEventListener("input", show);
      show();
    }
    const svg = body.querySelector("#timing");
    if (svg) drawTiming(svg);
  }
  function drawTiming(svg) {
    const rec = DATA.recording; // seconds from the first strike
    const plan = RP.planOf(723);
    const first = plan.blows[0].at;
    const x = (t) => 12 + t * (296 / 10.5);
    const row = (list, y, cls) => list.map((b) => `<line class="${cls(b)}" x1="${x(b.t).toFixed(1)}" x2="${x(b.t).toFixed(1)}" y1="${y - 9}" y2="${y + 9}"/>`).join("");
    const model = plan.blows.map((b) => ({ t: b.at - first, low: b.hammer === "low" }));
    svg.innerHTML = `<text x="0" y="10" class="t-l">recording</text><text x="0" y="45" class="t-l">model</text>` +
      `<line class="t-base" x1="12" x2="308" y1="25" y2="25"/><line class="t-base" x1="12" x2="308" y1="60" y2="60"/>` +
      row(rec, 25, (b) => (b.low ? "t-low" : "t-high")) + row(model, 60, (b) => (b.low ? "t-low" : "t-high"));
  }
  function unlockAudio() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      // a silent blip inside the gesture, for iOS
      const o = audio.createOscillator(), g = audio.createGain();
      g.gain.value = 0.00001; o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.02);
    } catch (e) { /* no audio */ }
  }
  function act(a) {
    if (a === "strike" || a === "ring") unlockAudio();
    if (a === "strike") { soundOn = true; strike(); }
    if (a === "pull") { if (mech.phase === "rest") pull(); else { rest(); setTimeout(() => pull(), 400); } }
    if (a === "slow") { mech.slow = mech.slow > 1 ? 1 : 12; panel.querySelector('[data-act="slow"]').textContent = mech.slow > 1 ? "Back to real speed" : "Slow the balance down"; }
    if (a === "ring") { soundOn = true; mech.time = 723; ringWithFlip(); }
    kick();
  }
  // the ringing chapter: start on the dial side, turn to the back for the hammers mid-strike
  let flipTimer = 0;
  const FRONT = { yaw: 0, pitch: -30, zoom: 16, fx: -4, fy: 1, fz: 1 };
  const BACKV = { yaw: 180, pitch: -24, zoom: 9, fx: -10.6, fy: 7.4, fz: -2.4 };
  function ringWithFlip() {
    clearTimeout(flipTimer);
    const go = () => strike();
    if (mech.phase !== "rest") { rest(); flipTimer = setTimeout(go, 500); } else go();
  }
  // in the ringing chapter the camera follows the strike: racks first, then round to the hammers
  function ringCamera() {
    if (CHAPTERS[chapter].id !== "ring") return;
    const back = mech.phase === "strike" && mech.pt > 1.9 && mech.pt < mech.plan.length - 0.4;
    const v = back ? BACKV : FRONT;
    if (view.user.yaw === 0) Object.assign(view.t, v);
  }

  // ---------- input ----------
  let drag = null;
  const pointers = new Map();
  stage.addEventListener("pointerdown", (e) => {
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, moved: 0, t: performance.now() };
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; drag = { pinch: Math.hypot(a[0] - b[0], a[1] - b[1]), zoom: view.user.zoom, moved: 99 }; }
  });
  stage.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (!drag) return;
    if (drag.pinch) {
      const [a, b] = [...pointers.values()];
      if (b) view.user.zoom = clamp(drag.zoom * Math.hypot(a[0] - b[0], a[1] - b[1]) / drag.pinch, 0.5, 4);
    } else {
      const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
      drag.moved += Math.abs(dx) + Math.abs(dy);
      view.user.yaw += dx * 0.45;
      view.user.pitch = clamp(view.user.pitch + dy * 0.35, -80, 80);
      view.auto = false;
    }
    view.lastInput = performance.now();
    kick();
  });
  const up = (e) => {
    pointers.delete(e.pointerId);
    if (drag && !drag.pinch && drag.moved < 6 && performance.now() - drag.t < 500) tap(e);
    if (pointers.size === 0) drag = null;
  };
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", (e) => { pointers.delete(e.pointerId); drag = null; });
  stage.addEventListener("wheel", (e) => { e.preventDefault(); view.user.zoom = clamp(view.user.zoom * Math.exp(-e.deltaY * 0.0015), 0.5, 4); view.lastInput = performance.now(); kick(); }, { passive: false });
  stage.addEventListener("dblclick", () => { view.user.yaw = 0; view.user.pitch = 0; view.user.zoom = 1; kick(); });
  const ray = new THREE.Raycaster();
  function tap(e) {
    const r = stage.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * 2 - 1, y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera({ x, y }, R.camera);
    const hits = ray.intersectObjects(W.parts.map((p) => p.mesh), false).filter((h) => (current.get(h.object.userData.part)?.dim ?? 1) > 0.5 || CHAPTERS[chapter].id === "apart");
    if (!hits.length) {
      if (["slide", "ring"].includes(CHAPTERS[chapter].id)) act(CHAPTERS[chapter].id === "slide" ? "pull" : "ring");
      selected = null; panel.querySelector("[data-info]").hidden = true; kick(); return;
    }
    const p = hits[0].object.userData.part;
    selected = p.group;
    const info = panel.querySelector("[data-info]");
    const role = (W.byName[p.group] || []).map((q) => q.role).find(Boolean) || p.role || "";
    const prov = p.prov === "seen" ? ["seen", "Traced from your video"] : p.prov === "role" ? ["role", "Seen in your video; its job is inferred"] : ["std", "Not visible: standard construction"];
    info.innerHTML = `<div class="info-name">${p.group}</div><span class="chip chip-${prov[0]}">${prov[1]}</span><p>${role}</p>`;
    info.hidden = false;
    if (status) status.textContent = `${p.group}. ${prov[1]}. ${role}`;
    kick();
  }
  document.querySelectorAll("[data-go]").forEach((b, k) => b.addEventListener("click", () => go(k)));
  $("[data-prev]").addEventListener("click", () => go(chapter - 1));
  $("[data-next]").addEventListener("click", () => go(chapter + 1));
  stage.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { view.user.yaw += 15; kick(); }
    if (e.key === "ArrowLeft") { view.user.yaw -= 15; kick(); }
    if (e.key === "ArrowUp") { view.user.pitch -= 10; kick(); }
    if (e.key === "ArrowDown") { view.user.pitch += 10; kick(); }
    if (e.key === "+" || e.key === "=") { view.user.zoom = clamp(view.user.zoom * 1.2, 0.5, 4); kick(); }
    if (e.key === "-") { view.user.zoom = clamp(view.user.zoom / 1.2, 0.5, 4); kick(); }
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); act("strike"); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === "PageDown" || (e.key === "ArrowRight" && e.target === document.body)) go(chapter + 1);
    if (e.key === "PageUp" || (e.key === "ArrowLeft" && e.target === document.body)) go(chapter - 1);
  });

  // ---------- loop ----------
  let frame = 0, last = 0, visible = true;
  function kick() { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } }
  function approach(cur, tgt, dt, tau) { return still.matches ? tgt : cur + (tgt - cur) * (1 - Math.exp(-dt / tau)); }
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
    last = now;
    const speed = window.__driveSpeed ?? 1;
    const d = dt * speed;
    mech.clock += d;
    let moving = false;
    // view
    for (const k of ["yaw", "pitch", "roll", "zoom", "fx", "fy", "fz"]) {
      const before = view[k];
      view[k] = approach(view[k], view.t[k], d, 0.38);
      if (Math.abs(view[k] - view.t[k]) < 0.002) view[k] = view.t[k];
      if (view[k] !== before) moving = true;
    }
    if (view.auto && now - view.lastInput > 6000) { view.spin += d * 9; moving = true; }
    // explode with stagger
    W.LAYERS.forEach(([name], i) => {
      const delay = stagger ? i * 0.045 : 0;
      if (stagger && (now - stagger) / 1000 < delay) { moving = true; return; }
      const before = layerOff[name];
      layerOff[name] = approach(layerOff[name], layerTarget[name], d, 0.45);
      if (Math.abs(layerOff[name] - layerTarget[name]) < 0.01) layerOff[name] = layerTarget[name];
      if (layerOff[name] !== before) moving = true;
      W.layers[name].visible = !(layerHide[name] && Math.abs(layerOff[name]) > 30);
    });
    // mechanisms
    if (mech.running) {
      mech.sec += d;
      if (mech.sec >= 60) { mech.sec -= 60; mech.time += 1; }
      const f = 3 / mech.slow;
      mech.slowK = 1 / mech.slow;
      mech.balance = Math.sin(mech.clock * 2 * Math.PI * f) * 220;
      moving = true;
    }
    if (stepMech(d)) moving = true;
    ringCamera();
    if (stepLooks(d)) moving = true;
    apply();
    orient();
    R.render(W.transparent);
    const text = CHAPTERS[chapter].readout();
    if (readout.textContent !== text) readout.textContent = text;
    frame = visible && moving ? requestAnimationFrame(tick) : 0;
  }
  new IntersectionObserver((es) => { visible = es[es.length - 1].isIntersecting; if (visible) kick(); }).observe(stage);
  new ResizeObserver(() => { size(); kick(); }).observe(stage);
  const syncTheme = () => {
    const dark = themeNow() === "dark";
    R.setPalette(dark ? DARK : LIGHT);
    for (const t of W.transparent) if (t.userData.glare) t.material.opacity = t.userData.glare * (dark ? 0.35 : 1);
    kick();
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncTheme);
  new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  size();
  syncTheme();
  const start = Math.max(0, CHAPTERS.findIndex((c) => "#" + c.id === location.hash));
  go(start, { instant: true });
  window.__watch = { go, act, mech, view, W, R, CHAPTERS };
})();

});</script>
